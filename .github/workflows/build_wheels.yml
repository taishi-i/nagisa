name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish the built wheels and sdist to TestPyPI"
        type: boolean
        default: false
      publish_to_pypi_version:
        description: "Publish to PyPI (master only): the version to publish, e.g. 0.3.2. Leave empty to skip."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Creating a release also pushes its tag; keep the two runs in separate groups
  # so that the push run never cancels the release run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && github.ref != 'refs/heads/master' }}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest: x86_64, ubuntu-24.04-arm: aarch64,
        # macos-latest: arm64, macos-15-intel: x86_64, windows-latest: AMD64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.5
      - name: Build wheels
        # Build options are in [tool.cibuildwheel] in pyproject.toml.
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  publish_testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nagisa/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    # Published by a release, or by a manual run on master that names the
    # version. The manual run is for uploading the files that are missing
    # when a release run stopped partway through.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish_to_pypi_version != '' &&
       github.ref == 'refs/heads/master')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/nagisa/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check that the requested version matches the package version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'release' && github.ref_name || inputs.publish_to_pypi_version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [ ! -f "dist/nagisa-${version}.tar.gz" ]; then
            echo "Requested version ${REQUESTED_VERSION} does not match the package version:"
            ls dist/*.tar.gz
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # Files that are already on PyPI are skipped, so a run that stopped
          # partway through can be run again.
          skip-existing: true
