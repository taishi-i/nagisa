name: Wheel smoke test (PyPI)

on:
  schedule:
    - cron: "3 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: Install & tag on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      # Only test/check_wheel.py is used; nagisa itself comes from PyPI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: |
          python -V
          pip -V

      - name: Install from PyPI (wheel-only)
        run: |
          python -m pip install -U pip
          pip install --upgrade --only-binary=:all: nagisa

      - name: Smoke test (tokenize & POS-tag)
        # Run as a script so the installed package is imported,
        # not the nagisa/ directory in the checkout.
        run: python test/check_wheel.py
